<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>転生林檎ダイブ</title>
<style>
  html,body{margin:0;height:100%;background:#1a0a14;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;background:#2a0f22;display:block}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<script>
'use strict';
// 転生林檎ダイブ — 落ちて、避けて、生まれ変わる。(Pinocchio-P「転生林檎」イメージのオリジナルゲーム)
const W=360,H=640,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT="'Hiragino Kaku Gothic ProN','Meiryo',sans-serif";
const rand=(a,b)=>a+Math.random()*(b-a);
const FORMS=[
  {name:'赤林檎',c:'#e8283c',leaf:'#4fbf5a',spd:340,r:17},
  {name:'青林檎',c:'#7fd65a',leaf:'#2f8f4a',spd:400,r:15},
  {name:'金林檎',c:'#ffc83a',leaf:'#e8a020',spd:300,r:19},
  {name:'黒林檎',c:'#3a2a4a',leaf:'#8a5acb',spd:440,r:14},
  {name:'白林檎',c:'#f4eef2',leaf:'#c9a0d8',spd:360,r:16},
];
let st='title',t=0,keys={},tx=null;
let p,items=[],parts=[],score=0,best=+localStorage.tenseiBest||0,speed=170,lives=5,form=0,spawnT=0,flash=0,shake=0,combo=0;
// 音
let ac;function beep(f,d=.1,ty='square',v=.06){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function reset(){p={x:W/2,y:170,vx:0};items=[];parts=[];score=0;speed=170;lives=5;form=0;spawnT=0;flash=0;shake=0;combo=0;st='play'}
function burst(x,y,col,n=18){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-160,160),vy:rand(-160,160),l:rand(.4,.9),c:col,s:rand(2,5)})}
function spawn(){
  const r=Math.random();
  if(r<.58)items.push({k:'haz',x:rand(24,W-24),y:H+30,w:rand(26,52),a:rand(0,6),sp:rand(-30,30)}); // 棘・刃
  else if(r<.9)items.push({k:'seed',x:rand(24,W-24),y:H+30});
  else items.push({k:'life',x:rand(30,W-30),y:H+30});
}
function hit(){
  lives--;combo=0;shake=.4;flash=1;beep(120,.4,'sawtooth',.1);burst(p.x,p.y,FORMS[form].c,40);
  if(lives<=0){st='over';best=Math.max(best,score);localStorage.tenseiBest=best;return}
  form=(form+1)%FORMS.length;beep(520,.15,'triangle');setTimeout(()=>beep(780,.25,'triangle'),120);
  items=items.filter(i=>i.k!=='haz'||Math.abs(i.y-p.y)>140); // 転生直後は少しだけ安全
}
function update(dt){
  t+=dt;
  if(st!=='play'){return}
  const F=FORMS[form];
  let dir=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  let target=dir*F.spd;
  if(tx!==null){const d=tx-p.x;target=Math.abs(d)>6?Math.sign(d)*Math.min(F.spd*1.6,Math.abs(d)*8):0}
  p.vx+=(target-p.vx)*Math.min(1,dt*12);p.x=Math.max(F.r,Math.min(W-F.r,p.x+p.vx*dt));
  speed+=dt*3.5;score+=dt*speed*.05;
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=rand(.25,.55)*170/speed*1.6}
  for(const i of items){i.y-=speed*dt;if(i.k==='haz'){i.x+=i.sp*dt;i.a+=dt*3;if(i.x<20||i.x>W-20)i.sp*=-1}
    const dx=i.x-p.x,dy=i.y-p.y;
    if(!i.dead){
      if(i.k==='haz'&&Math.hypot(dx,dy)<i.w*.42+F.r-3){i.dead=1;hit();if(st!=='play')return}
      else if(i.k==='seed'&&Math.hypot(dx,dy)<F.r+12){i.dead=1;combo++;score+=10*Math.min(combo,10);beep(660+combo*40,.08,'triangle');burst(i.x,i.y,'#ffe27a',8)}
      else if(i.k==='life'&&Math.hypot(dx,dy)<F.r+16){i.dead=1;lives=Math.min(7,lives+1);beep(900,.2,'sine',.1);burst(i.x,i.y,'#ff8ac0',20)}
    }}
  items=items.filter(i=>!i.dead&&i.y>-40);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt}
  parts=parts.filter(q=>q.l>0);
  flash=Math.max(0,flash-dt*2.5);shake=Math.max(0,shake-dt);
}
function apple(x,y,F,sc=1,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);const r=F.r;
  ctx.fillStyle=F.c;ctx.beginPath();ctx.arc(-r*.4,0,r*.75,0,7);ctx.arc(r*.4,0,r*.75,0,7);ctx.arc(0,r*.25,r*.8,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-r*.45,-r*.2,r*.18,r*.3,.5,0,7);ctx.fill();
  ctx.strokeStyle='#5a3a24';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,-r*.5);ctx.quadraticCurveTo(2,-r*1.1,r*.4,-r*1.2);ctx.stroke();
  ctx.fillStyle=F.leaf;ctx.beginPath();ctx.ellipse(r*.6,-r*.95,r*.45,r*.2,-.5,0,7);ctx.fill();
  // 目
  ctx.fillStyle=F.c==='#3a2a4a'?'#fff':'#2a1020';ctx.beginPath();ctx.arc(-r*.3,r*.2,2.2,0,7);ctx.arc(r*.3,r*.2,2.2,0,7);ctx.fill();
  ctx.restore();
}
function halo(x,y,r,a){ctx.strokeStyle=`rgba(255,240,180,${a})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-r*1.6,r*.7,r*.22,0,0,7);ctx.stroke()}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate(rand(-6,6)*shake*2,rand(-6,6)*shake*2);
  // 背景: 空から地へ、赤紫のグラデ
  const sp=t*speed*.3,g=ctx.createLinearGradient(0,0,0,H);
  const hue=(330+Math.sin(t*.1)*20+form*12)%360;
  g.addColorStop(0,`hsl(${hue},55%,16%)`);g.addColorStop(1,`hsl(${hue+30},60%,32%)`);ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  // 舞い上がる花びら/円環
  for(let i=0;i<28;i++){const x=(i*97)%W,y=H-((i*53+t*(40+i%5*18)*(speed/170))%(H+40));
    ctx.fillStyle=`hsla(${hue+10},80%,75%,${.1+(i%4)*.05})`;ctx.beginPath();ctx.ellipse(x,y,3+i%3,6+i%4,t+i,0,7);ctx.fill()}
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=2;
  for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(W/2,H*.72,60+((t*30+i*70)%280),0,7);ctx.stroke()}
  // アイテム
  for(const i of items){
    if(i.k==='haz'){ctx.save();ctx.translate(i.x,i.y);ctx.rotate(i.a);const n=8;ctx.fillStyle='#d8dcef';ctx.beginPath();
      for(let k=0;k<n*2;k++){const a=k/(n*2)*6.283,r=k%2?i.w*.22:i.w*.5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();
      ctx.fillStyle='#6a3a6a';ctx.beginPath();ctx.arc(0,0,i.w*.14,0,7);ctx.fill();ctx.restore()}
    else if(i.k==='seed'){ctx.save();ctx.translate(i.x,i.y);ctx.rotate(Math.sin(t*4+i.x)*.4);ctx.fillStyle='#ffe27a';ctx.shadowColor='#ffd040';ctx.shadowBlur=12;
      ctx.beginPath();ctx.ellipse(0,0,6,10,0,0,7);ctx.fill();ctx.restore()}
    else{ctx.save();ctx.translate(i.x,i.y);ctx.fillStyle='#ff8ac0';ctx.shadowColor='#ff5aa0';ctx.shadowBlur=16;ctx.font=`bold ${22+Math.sin(t*6)*2}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♥',0,0);ctx.restore()}
  }
  if(st!=='title'){ // プレイヤー
    const F=FORMS[form];
    ctx.save();ctx.shadowColor=F.c;ctx.shadowBlur=18;
    if(st==='play'){halo(p.x,p.y,F.r,.5+.3*Math.sin(t*5));apple(p.x,p.y,F,1,p.vx*.0012)}
    ctx.restore();
  }
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s)}ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.6})`;ctx.fillRect(-10,-10,W+20,H+20)}
  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  if(st==='play'){
    ctx.fillStyle='#fff';ctx.font=`bold 22px ${FONT}`;ctx.textAlign='left';ctx.fillText(Math.floor(score),14,32);
    ctx.font=`12px ${FONT}`;ctx.fillStyle='#ffd8e8';ctx.fillText(`BEST ${Math.floor(best)}`,14,50);
    ctx.textAlign='right';ctx.fillStyle='#ff8ac0';ctx.font=`18px ${FONT}`;ctx.fillText('♥'.repeat(lives),W-12,30);
    ctx.font=`12px ${FONT}`;ctx.fillStyle='#fff';ctx.fillText(`今世: ${FORMS[form].name}  ×${Math.max(1,combo)}`,W-12,50);
  }
  if(st==='title'){
    apple(W/2,200+Math.sin(t*2)*10,{...FORMS[0],r:44},1,Math.sin(t)*.2);halo(W/2,200+Math.sin(t*2)*10,44,.7);
    ctx.fillStyle='#fff';ctx.font=`bold 44px ${FONT}`;ctx.fillText('転生林檎',W/2,330);
    ctx.font=`bold 26px ${FONT}`;ctx.fillStyle='#ffc0d8';ctx.fillText('ダイブ',W/2,366);
    ctx.font=`14px ${FONT}`;ctx.fillStyle='#fff';
    ctx.fillText('刃を避け、種を集めて、何度でも生まれ変われ',W/2,420);
    ctx.fillText('← → / タッチ・ドラッグで移動',W/2,446);
    if(Math.sin(t*5)>0){ctx.font=`bold 20px ${FONT}`;ctx.fillStyle='#ffe27a';ctx.fillText('TAP / SPACE でスタート',W/2,520)}
  }
  if(st==='over'){
    ctx.fillStyle='rgba(10,0,10,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font=`bold 34px ${FONT}`;ctx.fillText('輪廻の果て',W/2,250);
    ctx.font=`22px ${FONT}`;ctx.fillText(`SCORE ${Math.floor(score)}`,W/2,300);
    ctx.fillStyle='#ffc0d8';ctx.font=`16px ${FONT}`;ctx.fillText(`BEST ${Math.floor(best)}`,W/2,330);
    if(Math.sin(t*5)>0){ctx.fillStyle='#ffe27a';ctx.font=`bold 18px ${FONT}`;ctx.fillText('TAP / SPACE でもう一度転生',W/2,400)}
  }
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function act(){if(st!=='play'){if(st==='over'&&t%1<0&&0)return;reset();beep(440,.1,'triangle')}}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space'||e.code==='Enter')act();if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=0});
function pos(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{act();tx=pos(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')tx=pos(e)});
cv.addEventListener('pointerup',()=>{tx=null});
</script>
</body>
</html>
