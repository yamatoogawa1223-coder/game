<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ログアウトできない街</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: relative; width: min(100vw, 100vh * 4 / 3); aspect-ratio: 4 / 3; }
  canvas { width: 100%; height: 100%; display: block; background: #000; }
  .pad { position: absolute; bottom: 2%; display: none; }
  .pad.l { left: 2%; grid-template-columns: repeat(3, 11vmin); grid-template-rows: repeat(2, 11vmin); gap: 1vmin; }
  .pad.r { right: 2%; gap: 2vmin; }
  .pad button {
    border-radius: 14px; border: 2px solid #ffd84a; background: rgba(20, 20, 40, .6); color: #ffd84a;
    font: 700 4.5vmin/1 'DotGothic16', sans-serif; touch-action: none;
  }
  .pad button.on { background: rgba(255, 216, 74, .5); }
  .pad.r button { width: 15vmin; height: 15vmin; border-radius: 50%; }
  @media (pointer: coarse) { .pad.l { display: grid; } .pad.r { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="480"></canvas>
  <div class="pad l">
    <span></span><button data-a="up">▲</button><span></span>
    <button data-a="left">◀</button><button data-a="down">▼</button><button data-a="right">▶</button>
  </div>
  <div class="pad r"><button data-a="cancel">X</button><button data-a="ok">Z</button></div>
</div>
<script>
'use strict';
// ログアウトできない街 — 弾幕×話を聞くRPG (HTML5 Canvas / 依存なし)

const W = 640, H = 480;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = "'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif";

// ---------- ユーティリティ ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const mixA = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = a => `rgb(${a.map(Math.round).join(',')})`;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } }
function txt(s, x, y, size = 20, col = '#fff', align = 'left', lh) {
  ctx.font = `${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'top';
  String(s).split('\n').forEach((l, i) => ctx.fillText(l, x, y + i * (lh || size * 1.45)));
}
function wrapJP(text, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  const out = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const ch of para) {
      if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; } else line += ch;
    }
    out.push(line);
  }
  return out.join('\n');
}
function box(x, y, w, h, border = '#fff') {
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = border; ctx.lineWidth = 4; ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
}
const HEART = ['.XX..XX.', 'XXXXXXXX', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..', '...XX...'];
function drawHeart(x, y, col, s = 2) {
  ctx.fillStyle = col;
  HEART.forEach((r, j) => [...r].forEach((c, i) => { if (c === 'X') ctx.fillRect(Math.round(x - 4 * s + i * s), Math.round(y - 3.5 * s + j * s), s, s); }));
}

// ---------- サウンド ----------
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* 音なしで続行 */ } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d = 0.08, type = 'square', v = 0.04, slide = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), n + d);
  g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(n + d);
}
const seq = (fs, d, type, v, gap = 90) => fs.forEach((f, i) => setTimeout(() => tone(f, d, type, v), i * gap));
const SFX = {
  blip: () => tone(480 + Math.random() * 80, 0.05, 'square', 0.02),
  sel: () => tone(660, 0.05, 'square', 0.03),
  ok: () => tone(880, 0.09, 'square', 0.04),
  hit: () => tone(180, 0.25, 'sawtooth', 0.07, -120),
  heal: () => seq([523, 784], 0.14, 'triangle', 0.06),
  spare: () => seq([523, 659, 784, 1047], 0.2, 'triangle', 0.06),
  slash: () => tone(320, 0.18, 'sawtooth', 0.06, -220),
  kill: () => seq([300, 220, 160, 110], 0.22, 'sawtooth', 0.05, 110),
  reply: () => seq([880, 1175], 0.12, 'sine', 0.05, 110),
};

// ---------- 入力 ----------
const held = { left: 0, right: 0, up: 0, down: 0, cancel: 0 };
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  KeyZ: 'ok', Enter: 'ok', Space: 'ok', KeyX: 'cancel', ShiftLeft: 'cancel', ShiftRight: 'cancel', Escape: 'cancel',
};
function press(a) { ensureAudio(); if (a in held) held[a] = 1; if (scene.onKey) scene.onKey(a); }
function release(a) { if (a in held) held[a] = 0; }
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault();
  if (e.repeat && (a === 'ok' || a === 'cancel')) return;
  press(a);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
document.querySelectorAll('.pad button').forEach(b => {
  const a = b.dataset.a;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); press(a); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => { b.classList.remove('on'); release(a); }));
});

// ---------- ゲーム状態 ----------
const G = {
  floor: 0, hp: 20, maxHp: 20, kills: 0, spared: 0, forceQuiet: false, qv: 0, sv: 0,
  items: [{ n: 'ぬるいお茶', heal: 10, c: 2 }, { n: '10分の仮眠', heal: 20, c: 1 }],
  reset() {
    Object.assign(this, { floor: 0, hp: 20, maxHp: 20, kills: 0, spared: 0, forceQuiet: false, qv: 0, sv: 0 });
    this.items = [{ n: 'ぬるいお茶', heal: 10, c: 2 }, { n: '10分の仮眠', heal: 20, c: 1 }];
  },
  tick(dt) {
    const tq = this.forceQuiet ? 1 : Math.min(1, this.spared * 0.2), ts = Math.min(1, this.kills * 0.3);
    this.qv += (tq - this.qv) * Math.min(1, dt * 1.2);
    this.sv += (ts - this.sv) * Math.min(1, dt * 1.2);
  },
};
let WT = 0, shake = 0;

// ---------- 街の描画 ----------
const BLD = [];
for (let i = 0; i < 18; i++) BLD.push({ x: i * 38 - 12 + hash(i) * 12, w: 34 + hash(i + 9) * 26, h: 80 + hash(i + 3) * 170, layer: i % 2, tl: i % 4 === 1 });
const WORDS = ['いいね！', 'RT', '炎上', '既読', '至急', '会議', '未読', '通知', '返信?', '締切', '#タグ', '@you', '納期', '…'];
function drawTown() {
  const q = G.qv, s = G.sv, t = WT;
  let top = mixA([118, 128, 255], [6, 10, 38], q), bot = mixA([214, 186, 255], [30, 44, 98], q);
  top = mixA(top, [214, 220, 228], s); bot = mixA(bot, [246, 248, 250], s);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (q > 0.12) {
    for (let i = 0; i < 70; i++) {
      const a = (q - 0.12) * (0.5 + 0.5 * Math.sin(t * 2 + i)) * (1 - s);
      ctx.fillStyle = `rgba(255,255,230,${a})`; const z = i % 5 === 0 ? 3 : 2;
      ctx.fillRect(hash(i) * W, hash(i + 50) * 260, z, z);
    }
  }
  if (q > 0.5) { ctx.globalAlpha = (q - 0.5) * 2 * (1 - s); circ(110, 80, 26, '#f7f2c8'); ctx.globalAlpha = 1; }
  // 空の通知バッジ
  const n = Math.round(99 * (1 - q)) , bs = 1 - s;
  if (n > 0 && bs > 0.05) {
    const pulse = 1 + Math.sin(t * 4) * 0.05, r = (18 + 22 * (1 - q)) * pulse;
    ctx.globalAlpha = bs; circ(555, 66, r, '#ea3340');
    txt(n >= 95 ? '99+' : String(n), 555, 66 - r * 0.42, r * 0.85, '#fff', 'center'); ctx.globalAlpha = 1;
  }
  // 最上階の塔
  const tc = mixA(mixA([46, 52, 120], [14, 18, 44], q), [196, 202, 212], s);
  ctx.fillStyle = rgb(tc); ctx.fillRect(W / 2 - 22, 70, 44, H); ctx.fillRect(W / 2 - 10, 40, 20, 40);
  const glow = 0.5 + 0.5 * Math.sin(t * 3);
  ctx.fillStyle = `rgba(120,255,200,${0.4 + 0.5 * glow})`; ctx.fillRect(W / 2 - 8, 44, 16, 6);
  txt('LOGOUT', W / 2, 26, 9, `rgba(150,255,210,${0.5 + 0.5 * glow})`, 'center');
  // ビル群
  const climb = G.floor * 10;
  for (let layer = 0; layer < 2; layer++) {
    BLD.forEach((b, bi) => {
      if (b.layer !== layer) return;
      const y0 = H - b.h * (layer ? 0.8 : 1) + climb * (layer ? 1 : 0.6) + 20;
      let c = layer ? [40, 44, 100] : [60, 66, 140];
      c = mixA(mixA(c, [10, 12, 32], q * 0.9), [186, 192, 202], s);
      ctx.fillStyle = rgb(c); ctx.fillRect(b.x, y0, b.w, H);
      const lit = (1 - q * 0.95) * (1 - s * 0.6);
      for (let wy = y0 + 8; wy < 300; wy += 13) for (let wx = b.x + 5; wx < b.x + b.w - 6; wx += 10) {
        const k = hash(wx * 3.1 + wy * 7.7 + bi);
        if (k < lit * 0.75) {
          const blink = 0.6 + 0.4 * Math.sin(t * 2 + k * 40);
          ctx.fillStyle = s > 0.5 ? 'rgba(235,240,245,.9)' : `rgba(255,${210 + k * 40},${120 + k * 60},${blink})`;
          ctx.fillRect(wx, wy, 5, 7);
        }
      }
      if (b.tl && layer === 1 && q < 0.8 && s < 0.6) {
        ctx.save(); ctx.beginPath(); ctx.rect(b.x, y0 + 4, b.w, 130); ctx.clip();
        ctx.globalAlpha = 0.55 * (1 - q) * (1 - s);
        for (let i = 0; i < 12; i++) {
          const yy = y0 + 4 + ((i * 14 - t * 24) % 168 + 168) % 168 - 14;
          txt(WORDS[(bi + i) % WORDS.length], b.x + 3, yy, 10, '#fff');
        }
        ctx.restore();
      }
    });
  }
  if (s > 0.3) { ctx.fillStyle = `rgba(255,255,255,${(s - 0.3) * 0.25})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- タイプライター ----------
class Typer {
  constructor() { this.text = ''; this.n = 0; this.acc = 0; }
  set(t, maxW = 520, size = 20) { this.text = wrapJP(t, maxW, size); this.n = 0; this.acc = 0; }
  get done() { return this.n >= this.text.length; }
  skip() { this.n = this.text.length; }
  update(dt) {
    if (this.done) return;
    this.acc += dt;
    while (this.acc > 0.028 && !this.done) {
      this.acc -= 0.028; this.n++;
      const c = this.text[this.n - 1];
      if (c !== ' ' && c !== '\n' && this.n % 2 === 0) SFX.blip();
    }
  }
  get shown() { return this.text.slice(0, this.n); }
}

// ---------- シーン管理 ----------
let scene = null;
function setScene(s) { scene = s; }

// 汎用テキストシーン: pages は文字列 or {t, big}
class TextScene {
  constructor(pages, opt = {}) {
    this.pages = pages; this.i = 0; this.opt = opt; this.typer = new Typer(); this.fade = 0;
    this.load();
  }
  load() {
    const p = this.pages[this.i];
    this.big = typeof p === 'object' && p.big;
    const t = typeof p === 'string' ? p : p.t;
    this.big ? this.typer.set(t, 560, 30) : this.typer.set(t, 520, 20);
  }
  update(dt) { this.typer.update(dt); this.fade = Math.min(1, this.fade + dt * 2); }
  onKey(a) {
    if (a !== 'ok') return;
    if (!this.typer.done) { this.typer.skip(); return; }
    SFX.ok();
    if (++this.i >= this.pages.length) { this.opt.onDone && this.opt.onDone(); return; }
    this.load();
  }
  draw() {
    if (this.opt.bg === 'black') { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); } else drawTown();
    if (this.big) {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 170, W, 130);
      txt(this.typer.shown, W / 2, 200, 30, '#fff', 'center', 44);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, H);
      box(40, 320, 560, 130);
      txt(this.typer.shown, 64, 338, 20);
      if (this.typer.done) txt('▼', 572, 424, 14, '#fff', 'center');
    }
  }
}

// ---------- タイトル ----------
class Title {
  constructor() { this.t = 0; }
  update(dt) { this.t += dt; }
  onKey(a) {
    if (a !== 'ok') return;
    SFX.ok(); G.reset();
    setScene(new TextScene(INTRO, { onDone: () => startFloor(0) }));
  }
  draw() {
    drawTown();
    ctx.fillStyle = 'rgba(0,0,10,.5)'; ctx.fillRect(0, 0, W, H);
    txt('ログアウトできない街', W / 2, 130, 48, '#fff', 'center');
    txt('── 頑張らなくて いい ──', W / 2, 200, 20, '#bcd', 'center');
    if (Math.sin(this.t * 4) > -0.3) txt('Z / Enter ではじめる', W / 2, 300, 22, '#ffd84a', 'center');
    txt('矢印 / WASD: 移動・選択     Z: 決定     X / Shift: 戻る・ゆっくり移動', W / 2, 400, 14, '#9ab', 'center');
    txt('ずっと 眠れていない あなたへ', W / 2, 430, 14, '#789', 'center');
  }
}

const INTRO = [
  '……深夜2時。\nデスクのモニターは まだ光っている。',
  '通知が 鳴る。 また 鳴る。\n──意識が、ふっと 途切れた。',
  '目を覚ますと、知らない街の 入口に いた。',
  '空には ずっと 通知バッジが 浮かんでいる。\nこの街には、夜が 来ない。',
  'どこかから 声がする。\n『ログアウトは 最上階です』',
  '「ずっとオンライン」の 最上階に\nログアウトボタンが あるらしい。',
  { t: '帰ろう。──上へ。', big: true },
];

// ---------- 敵データ ----------
const ENEMIES = [
  {
    id: 'tsuchi', name: 'ツーチ', hp: 30, need: 3, box: [190, 250, 260, 140], dur: 8,
    floorName: '1F\nタイムラインの広場',
    arrive: ['広場の 大きな画面に タイムラインが 流れ続けている。\nピコピコと 音が 近づいてくる……'],
    intro: 'ピコピコピコ！\nツーチ が あらわれた！',
    flavor: ['ツーチ は ピコピコ 鳴っている。', '未読 99+ の雨が ふっている。', '空の バッジが ちかちか 光る。'],
    acts: [
      { id: 'chk', n: '調べる', t: 'ツーチ ─ HP30 / 通知の化身。\nうるさいけど、本当は「誰かに 気づいてほしい」だけ。' },
      { id: 'look', n: '見つめる', once: 1, calm: 1, t: 'ツーチ の目を まっすぐ 見た。\nピコ……？ 音が 少し 小さくなった。' },
      { id: 'open', n: '未読を開く', once: 1, calm: 1, t: '未読を ひとつ 開いて「見たよ」と言った。\nツーチ の 体が ふるえる。' },
      { id: 'thx', n: '「ありがとう」', once: 1, calm: 1, t: '「知らせてくれて ありがとう」\nツーチ は 目を まるくした。' },
      { id: 'off', n: '通知を切る', bad: 1, t: '通知を 切ろうとした。\nツーチ は かなしそうに 大きく 鳴った！' },
    ],
    talk: [['ピコピコピコ！！', 'ミテ！ ミテ！ ミテ！', '未読が…たまってる…！'], ['ピコ…？', '…ちゃんと 見てる？'], ['ピ…コ…', '…みてくれて、ありがと。']],
    spare: 'ツーチ は ぴこん、と ひとつだけ 鳴いて\n静かに 消えていった。\n『…ありがとう。』',
    kill: 'ツーチ は 消えた。\n……空が 少し 静かになった。\nとても 便利だ。',
    attack(B) {
      const m = B.mul(), { L, R, T, Bt } = B.inner(), v = B.turn % 3, cx = (L + R) / 2;
      if (v === 0) B.tick('a', 0.3, () => B.add({ type: 'badge', x: rand(L, R), y: T - 12, vy: 105 * m, r: 7 }));
      if (v === 1) B.tick('a', 0.5, () => {
        const d = Math.random() < 0.5 ? 1 : -1, y0 = rand(T + 20, Bt - 20);
        B.add({ type: 'badge', x: d > 0 ? L - 12 : R + 12, y: y0, vx: d * 95 * m, r: 7, fn: b => { b.y = y0 + Math.sin(b.age * 5) * 30; } });
      });
      if (v === 2) {
        B.tick('r', 1.5, () => { for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; B.add({ type: 'dot', x: cx, y: T + 30, vx: Math.cos(a) * 70 * m, vy: Math.sin(a) * 70 * m, r: 4, col: '#ff6b7a' }); } });
        B.tick('a', 0.7, () => B.add({ type: 'badge', x: rand(L, R), y: T - 12, vy: 90 * m, r: 7 }));
      }
    },
    draw(x, y, t, c) {
      const wob = Math.sin(t * (14 - 9 * c)) * (4 - 2.6 * c);
      ctx.save(); ctx.translate(x + wob, y + Math.sin(t * 3) * 3);
      for (let i = 0; i < 2; i++) {
        const k = ((t * (1 - 0.6 * c) + i * 0.5) % 1); ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - k)})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 50 + k * 50, -0.9, 0.3); ctx.stroke();
      }
      ctx.fillStyle = '#5b6cf0'; ctx.beginPath(); ctx.moveTo(-42, 34); ctx.quadraticCurveTo(-50, -12, -32, -34);
      ctx.quadraticCurveTo(0, -68, 32, -34); ctx.quadraticCurveTo(50, -12, 42, 34); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8fa0ff'; ctx.fillRect(-48, 32, 96, 10); circ(0, 52, 8, '#ffd84a');
      // 目
      if (c > 0.66) { ctx.strokeStyle = '#111'; ctx.lineWidth = 4; [-16, 16].forEach(ex => { ctx.beginPath(); ctx.arc(ex, -2, 8, Math.PI, 0); ctx.stroke(); }); }
      else { [-16, 16].forEach(ex => { circ(ex, -4, 11, '#fff'); circ(ex + Math.sin(t * 2) * 2, -3, 5 - c * 2, '#111'); }); }
      ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath();
      c > 0.4 ? ctx.arc(0, 12, 9, 0.1, Math.PI - 0.1) : ctx.arc(0, 22, 8, Math.PI + 0.3, -0.3); ctx.stroke();
      const bs = 1 - c * 0.7; circ(30, -44, 17 * bs, '#ea3340'); if (bs > 0.5) txt('99+', 30, -44 - 6, 12, '#fff', 'center');
      ctx.restore();
    },
  },
  {
    id: 'kidoku', name: 'キドク', hp: 40, need: 3, box: [170, 250, 300, 140], dur: 8,
    floorName: '2F\n既読の回廊',
    arrive: ['長い回廊に 吹き出しが 並んでいる。\nどれも「既読」の文字が ついたまま 止まっている。'],
    intro: '回廊の 奥で キドク が\n背を向けて 立っている。',
    flavor: ['キドク は 背を向けたままだ。', '「既読」の 文字が 宙に 浮いている。', 'キドク は 何か 言いたそうだ。'],
    acts: [
      { id: 'chk', n: '調べる', t: 'キドク ─ HP40 / 既読スルーの化身。\n返事を したいのに 何て言えばいいか わからない。' },
      {
        id: 'listen', n: '話を聞く', seq: [
          '「…聞いて、いいの？」\nキドク が ぽつりと 話し始めた。\n「あの人から メッセージが 来たんだ。」',
          '口をはさまず うなずいた。\n「返事を 考えてるうちに 1週間 たっちゃって…」',
          'さいごまで うなずき続けた。\n「…怖かった。 嫌われるのが。」\nキドク が ゆっくり ふり向く。',

// ---------- 階の進行 ----------
function startFloor(i) {
  G.floor = i;
  const E = ENEMIES[i];
  setScene(new TextScene([{ t: E.floorName, big: true }, ...E.arrive], { onDone: () => { G.hpStart = G.hp; setScene(new Battle(E)); } }));
}
function afterFloor(kind) {
  const i = G.floor, pages = [];
  if (kind === 'killed') {
    if (G.kills === 1) pages.push('LV が あがった。\n……HPの上限が 3 へった。\n体が すこし 重い。 なにかが 戻らない気がする。');
    else pages.push(`LV ${G.kills + 1}。 HPの上限が また 3 へった。\n街は もっと 静かで 便利に なった。`);
  } else if (G.kills === 0) {
    G.hp = G.maxHp;
    pages.push('「ちょっと 休もうよ」\n街のあちこちで 声をかけて まわった。', 'HPが 全回復した。\n街が すこし 静かに なった。');
  } else {
    pages.push('「ちょっと 休もうよ」と 声をかけた。\n街は 少し 静かになった。 でも……体力は 戻らない。');
  }
  pages.push('エレベーターに のって 上の階へ。');
  setScene(new TextScene(pages, { onDone: () => startFloor(i + 1) }));
}

class Battle {
  constructor(E) {
    this.E = E; this.eff = !!E.boss && G.kills > 0;
    this.ehp = this.eff ? E.effHp : E.hp; this.maxEhp = this.ehp;
    this.calm = 0; this.bad = 0; this.slow = 0; this.used = {}; this.seq = {}; this.turn = 0;
    this.ea = 1; this.t = 0; this.menu = 0; this.sub = 0; this.inv = 0; this.at = 0; this.timer = 0;
    this.bx = { x: 40, y: 250, w: 560, h: 140 }; this.tb = [40, 250, 560, 140];
    this.bullets = []; this.pat = {}; this.parts = []; this.pop = null; this.showHp = 0;
    this.typer = new Typer(); this.bub = new Typer(); this.hx = 320; this.hy = 320;
    this.hpStart = G.hp;
    this.say(this.eff && E.introEff ? E.introEff : E.intro, () => this.toMenu());

  useItem(it) {

  finishEff(kind) {

  update(dt) {

  'オートさん『……おやすみ』',
  '通知バッジが ひとつ、また ひとつ 消えていく。',
  '街じゅうの 窓の 灯りが ゆっくり 消えて──',
  { t: '夜が、やって来た。', big: true },

class Bedroom {

    if (!this.typer.done) { this.typer.skip(); return; }
    SFX.ok();
    if (++this.i >= this.pages.length) { this.end = true; this.endT = this.t; SFX.spare(); } else this.typer.set(this.pages[this.i]);
  }
  draw() {
    const k = clamp(this.t / 3, 0, 1);
    ctx.fillStyle = rgb(mixA([20, 22, 50], [255, 236, 200], k)); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = rgb(mixA([30, 30, 60], [240, 214, 170], k)); ctx.fillRect(0, 300, W, 180);
    // 窓
    ctx.fillStyle = rgb(mixA([10, 14, 40], [190, 230, 255], k)); ctx.fillRect(430, 60, 140, 150);
    ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 6; ctx.strokeRect(430, 60, 140, 150); ctx.beginPath(); ctx.moveTo(500, 60); ctx.lineTo(500, 210); ctx.stroke();
    ctx.fillStyle = `rgba(255,240,180,${0.35 * k})`; ctx.beginPath(); ctx.moveTo(430, 210); ctx.lineTo(570, 210); ctx.lineTo(420, 400); ctx.lineTo(120, 400); ctx.fill();
    // ベッド
    ctx.fillStyle = '#7a5a4a'; ctx.fillRect(60, 300, 380, 30); ctx.fillRect(60, 260, 20, 100); ctx.fillRect(420, 280, 20, 80);
    ctx.fillStyle = '#e8ecff'; ctx.fillRect(80, 262, 84, 44);
    ctx.fillStyle = '#f0c9a0'; circ(120, 268, 22, '#f0c9a0'); ctx.fillStyle = '#3a3040'; ctx.beginPath(); ctx.arc(120, 262, 22, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#6d8bd8'; ctx.beginPath(); ctx.roundRect(100, 275, 320, 40, 14); ctx.fill();
    const br = Math.sin(this.t * 1.2) * 2; ctx.fillStyle = '#7d9be8'; ctx.fillRect(160, 272 + br, 200, 8);
    // 枕元
    ctx.fillStyle = '#5a4a3a'; ctx.fillRect(470, 300, 90, 60);
    ctx.fillStyle = '#111'; ctx.fillRect(490, 284, 26, 16); ctx.fillStyle = '#4c4'; ctx.fillRect(500, 292, 6, 2);
    if (!this.end) {
      box(40, 380, 560, 90); txt(this.typer.shown, 64, 394, 20); if (this.typer.done) txt('▼', 572, 446, 14, '#fff', 'center');
    } else {
      const a = clamp((this.t - this.endT) / 1.5, 0, 1);
      ctx.fillStyle = `rgba(0,0,0,${0.7 * a})`; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = a;
      txt('ログアウトできない街', 320, 120, 40, '#fff', 'center');
      txt('TRUE END ─ おやすみ', 320, 190, 28, '#ffd84a', 'center');
      txt('強くなることじゃなくて、\n休むことが クリアの条件でした。', 320, 250, 20, '#fff', 'center', 34);
      txt('頑張らなくて いい。  話を 聞いてあげよう。', 320, 340, 18, '#bcd', 'center');
      if (a >= 1) txt('Z: タイトルへ', 320, 410, 16, '#ffd84a', 'center');
      ctx.globalAlpha = 1;
    }
  }
}

class LogoutScene {
  constructor() { this.t = 0; this.step = 0; this.p = 0; this.typer = new Typer(); this.msgs = null; }
  update(dt) {
    this.t += dt; this.typer.update(dt);
    if (this.step === 1) { this.p = Math.min(0.99, this.p + dt * 0.35); if (this.p >= 0.99) { this.hold = (this.hold || 0) + dt; if (this.hold > 1.2) { this.step = 2; this.msg('エラー: 未読の通知が 99+ 件 あります。\nログアウトに 失敗しました。'); } } }
  }
  msg(t) { this.typer.set(t, 520, 20); }
  onKey(a) {
    if (a !== 'ok') return;
    if (this.step === 0) { SFX.ok(); this.step = 1; return; }
    if (this.step === 2 || this.step === 3) {
      if (!this.typer.done) { this.typer.skip(); return; }
      if (this.step === 2) { this.step = 3; this.msg('もう一度 試しますか？\n▶ はい     ▶ はい'); }
      else setScene(new EndCard('bad'));
    }
  }
  draw() {
    G.sv = 1; drawTown();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(0, 0, W, H);
    const pulse = 1 + Math.sin(this.t * 4) * 0.03;
    ctx.save(); ctx.translate(320, 170); ctx.scale(pulse, pulse);
    ctx.fillStyle = '#39c07a'; ctx.beginPath(); ctx.roundRect(-110, -34, 220, 68, 14); ctx.fill();
    txt('LOGOUT', 0, -14, 30, '#fff', 'center'); ctx.restore();
    if (this.step === 0) txt('Z で ログアウト', 320, 240, 18, '#333', 'center');
    if (this.step === 1) {
      txt('ログアウトしています…', 320, 240, 18, '#333', 'center');
      ctx.fillStyle = '#ccc'; ctx.fillRect(170, 275, 300, 16); ctx.fillStyle = '#39c07a'; ctx.fillRect(170, 275, 300 * this.p, 16);
      txt(`${Math.floor(this.p * 100)}%`, 320, 296, 14, '#333', 'center');
    }
    if (this.step >= 2) { box(40, 320, 560, 130); txt(this.typer.shown, 64, 338, 20); if (this.typer.done) txt('▼', 572, 424, 14, '#fff', 'center'); }
  }
}

class EndCard {
  constructor(kind) { this.t = 0; this.kind = kind; SFX.kill(); }
  update(dt) { this.t += dt; }
  onKey(a) { if (a === 'ok' && this.t > 2) setScene(new Title()); }
  draw() {
    G.sv = 1; drawTown();
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.85, this.t * 0.5)})`; ctx.fillRect(0, 0, W, H);
    const a = clamp((this.t - 0.8) / 1.2, 0, 1);
    ctx.globalAlpha = a;
    txt('BAD END ─ ずっとオンライン', 320, 130, 32, '#f66', 'center');
    txt('街は 静かで 便利に なった。\nけれど 体力は もう 戻らない。\n──この街からは、ログアウトできない。', 320, 210, 20, '#fff', 'center', 36);
    txt('もし もう一度 歩くなら、\n倒さずに 話を 聞いてみよう。', 320, 340, 16, '#9ab', 'center', 28);
    if (this.t > 2) txt('Z: はじめから', 320, 420, 16, '#ffd84a', 'center');
    ctx.globalAlpha = 1;
  }
}

// ---------- メインループ ----------
setScene(new Title());
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  WT += dt; G.tick(dt); scene.update(dt);
  ctx.save();
  if (shake > 0) { ctx.translate(rand(-shake, shake), rand(-shake, shake)); shake = Math.max(0, shake - dt * 30); }
  scene.draw();
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.LT = { G, get scene() { return scene; }, setScene, Battle, ENEMIES, startFloor, Title, Bedroom, LogoutScene, EndCard, GOOD_END };
</script>
